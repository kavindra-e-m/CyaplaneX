[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyaplanex"
version = "0.1.0"
description = "Scaffold for trusted closed-loop edge predictive maintenance"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["edge*", "cloud*", "shared*", "ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
